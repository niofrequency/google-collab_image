<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MiniMax-H3 — Image to Video</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #141414;
      --border: #2a2a2a;
      --text: #e8e8e8;
      --muted: #888;
      --accent: #8b2e2e;
      --accent-hover: #a33a3a;
    }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    .container { max-width: 1000px; margin: 0 auto; padding: 32px 20px; }
    h1 { margin: 0 0 8px; font-weight: 500; letter-spacing: -0.5px; }
    .sub { color: var(--muted); font-size: 14px; margin-bottom: 24px; }
    label { display: block; margin: 16px 0 6px; font-size: 13px; color: var(--muted); font-weight: 500; }
    input, select, textarea, button {
      width: 100%;
      padding: 10px 12px;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
    }
    textarea { min-height: 100px; resize: vertical; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
    button {
      cursor: pointer;
      background: var(--accent);
      border: none;
      font-weight: 500;
      margin-top: 12px;
    }
    button:hover { background: var(--accent-hover); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.secondary { background: #222; }
    button.secondary:hover { background: #2a2a2a; }
    .row { display: flex; gap: 16px; }
    .row > div { flex: 1; }
    .status { margin: 12px 0; min-height: 20px; font-size: 14px; }
    .status.error {
      background: #2a1515;
      color: #e74c3c;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid #5a2a2a;
    }
    .status.ok {
      background: #152a1a;
      color: #2ecc71;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid #2a5a35;
    }
    .preview { max-height: 200px; margin-top: 8px; border-radius: 8px; border: 1px solid var(--border); }
    .video-result { margin-top: 16px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .video-result video { max-width: 100%; max-height: 70vh; border-radius: 8px; background: #000; }
    .video-download {
      display: inline-block; width: auto; padding: 8px 16px; border-radius: 8px; background: #222;
      color: var(--text); text-decoration: none; font-size: 14px; font-weight: 500;
    }
    .video-download:hover { background: #2a2a2a; }
    .header-row { display: flex; gap: 12px; align-items: flex-end; margin-bottom: 16px; }
    .header-row input { flex: 1; margin: 0; }
    .header-row button { width: auto; margin: 0; padding: 10px 16px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>MiniMax-H3 Image-to-Video</h1>
    <p class="sub">24 FPS multimodal video + native stereo audio via Google Colab</p>

    <div class="header-row">
      <div style="flex:1">
        <label>Cloudflare Tunnel URL</label>
        <input id="apiUrl" type="url" placeholder="https://your-id.trycloudflare.com" />
      </div>
      <button id="checkBtn" class="secondary">Ping</button>
    </div>

    <div id="status" class="status"></div>

    <label>1. Starting Frame Image</label>
    <input id="imageInput" type="file" accept="image/png,image/jpeg,image/webp" />
    <img id="previewImg" class="preview" style="display:none" />

    <label>2. Motion & Audio Prompt</label>
    <textarea id="promptInput" placeholder="Describe the camera movement, subject action, and ambient sounds..."></textarea>

    <div class="row">
      <div>
        <label>Duration (sec)</label>
        <input id="durationInput" type="number" step="0.7" min="5.2" max="15" value="5.2" />
      </div>
      <div>
        <label>Steps</label>
        <input id="stepsInput" type="number" min="4" max="50" value="20" />
      </div>
      <div>
        <label>Seed</label>
        <input id="seedInput" type="number" value="42" />
      </div>
    </div>

    <button id="generateBtn">Generate Video</button>

    <div class="video-result" id="resultArea" style="display:none">
      <video id="outputVideo" controls loop></video>
      <a id="downloadBtn" class="video-download" download="minimax-h3-output.mp4">Download MP4</a>
    </div>
  </div>

  <script>
    const apiUrlInput = document.getElementById("apiUrl");
    const statusEl = document.getElementById("status");
    const imageInput = document.getElementById("imageInput");
    const previewImg = document.getElementById("previewImg");
    const generateBtn = document.getElementById("generateBtn");
    const resultArea = document.getElementById("resultArea");
    const outputVideo = document.getElementById("outputVideo");
    const downloadBtn = document.getElementById("downloadBtn");

    apiUrlInput.value = localStorage.getItem("minimax_api_url") || "";
    apiUrlInput.addEventListener("change", () => {
      localStorage.setItem("minimax_api_url", apiUrlInput.value.trim().replace(/\/$/, ""));
    });

    function showStatus(msg, isError = false) {
      statusEl.textContent = msg;
      statusEl.className = "status " + (isError ? "error" : "ok");
    }

    imageInput.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (file) {
        previewImg.src = URL.createObjectURL(file);
        previewImg.style.display = "block";
      }
    });

    document.getElementById("checkBtn").addEventListener("click", async () => {
      const baseUrl = apiUrlInput.value.trim().replace(/\/$/, "");
      if (!baseUrl) return showStatus("Enter your Cloudflare Tunnel URL first.", true);
      try {
        const res = await fetch(baseUrl + "/health");
        const data = await res.json();
        showStatus("Connected to backend: " + data.model);
      } catch (err) {
        showStatus("Failed to reach Colab backend. Check if the tunnel cell is still running.", true);
      }
    });

    generateBtn.addEventListener("click", async () => {
      const baseUrl = apiUrlInput.value.trim().replace(/\/$/, "");
      const file = imageInput.files[0];
      const prompt = document.getElementById("promptInput").value.trim();

      if (!baseUrl) return showStatus("Please paste your Cloudflare Tunnel URL.", true);
      if (!file) return showStatus("Please upload a starting frame image.", true);
      if (!prompt) return showStatus("Please enter a prompt.", true);

      const formData = new FormData();
      formData.append("image", file);
      formData.append("prompt", prompt);
      formData.append("duration", document.getElementById("durationInput").value);
      formData.append("steps", document.getElementById("stepsInput").value);
      formData.append("seed", document.getElementById("seedInput").value);

      generateBtn.disabled = true;
      resultArea.style.display = "none";
      showStatus("Generating on Colab GPU... this can take a few minutes.");

      try {
        const response = await fetch(baseUrl + "/generate", {
          method: "POST",
          body: formData,
        });

        if (!response.ok) {
          const errData = await response.json();
          throw new Error(errData.detail || "Generation failed");
        }

        const data = await response.json();
        const videoUrl = "data:video/mp4;base64," + data.video_base64;

        outputVideo.src = videoUrl;
        downloadBtn.href = videoUrl;
        resultArea.style.display = "flex";
        showStatus("Generated " + data.frames + " frames successfully!");
      } catch (err) {
        showStatus("Error: " + err.message, true);
      } finally {
        generateBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
