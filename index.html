<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARX Image Generator</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230a0a0a'/><path d='M8 22V10h3.2l3.8 7.5L18.8 10H22v12h-2.4v-7.8L16 22h-1.2l-3.6-7.8V22H8z' fill='white'/></svg>">
<style>
  :root {
    --bg: #0a0a0a;
    --surface: #141414;
    --border: #2a2a2a;
    --text: #e8e8e8;
    --muted: #888;
    --accent: #8b2e2e;
    --accent-hover: #a33a3a;
  }
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }
  .container { max-width: 1000px; margin: 0 auto; padding: 32px 20px; }
  h1 { margin: 0 0 24px; font-weight: 500; letter-spacing: -0.5px; }
  label { display: block; margin: 16px 0 6px; font-size: 13px; color: var(--muted); font-weight: 500; }
  input, select, textarea, button {
    width: 100%;
    padding: 10px 12px;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
  }
  textarea { min-height: 100px; resize: vertical; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
  .row { display: flex; gap: 16px; }
  .row > div { flex: 1; }
  .lora-item {
    background: var(--surface);
    padding: 12px;
    margin-bottom: 8px;
    border-radius: 8px;
    border: 1px solid var(--border);
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .lora-item input { margin: 0; }
  .lora-item button { width: auto; padding: 6px 12px; }
  button {
    cursor: pointer;
    background: var(--accent);
    border: none;
    font-weight: 500;
    transition: background 0.15s;
  }
  button:hover { background: var(--accent-hover); }
  button.secondary { background: #222; }
  button.secondary:hover { background: #2a2a2a; }
  button.danger { background: #5a1f1f; }
  button.danger:hover { background: #7a2a2a; }
  .gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 12px;
    margin-top: 16px;
  }
  .gallery img {
    width: 100%;
    height: 200px;
    object-fit: cover;
    border-radius: 8px;
    cursor: pointer;
    border: 1px solid var(--border);
  }
  #lightbox {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.92);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    cursor: zoom-out;
  }
  .lb-image-wrap {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #lbImage {
    max-width: 85vw;
    max-height: 85vh;
    border-radius: 8px;
    cursor: zoom-in;
    transition: transform 0.2s ease;
  }
  #lbImage.zoomed {
    transform: scale(1.8);
    cursor: zoom-out;
    max-width: none;
    max-height: none;
  }
  .lb-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(20,20,20,0.85);
    border: 1px solid #333;
    color: white;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s;
  }
  .lb-btn:hover { background: rgba(40,40,40,0.95); }
  .lb-btn.left { left: -60px; }
  .lb-btn.right { right: -60px; }
  .status {
    margin: 12px 0;
    min-height: 20px;
    font-size: 14px;
  }
  .status.error {
    background: #2a1515;
    color: #e74c3c;
    padding: 12px 16px;
    border-radius: 10px;
    border: 1px solid #5a2a2a;
  }
  .status.ok {
    background: #152a1a;
    color: #2ecc71;
    padding: 12px 16px;
    border-radius: 10px;
    border: 1px solid #2a5a35;
  }
  .progress {
    height: 8px;
    background: #1a1a1a;
    border-radius: 4px;
    overflow: hidden;
    margin: 10px 0;
    display: none;
  }
  .progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--accent), #a33a3a);
    border-radius: 4px;
    transition: width 0.4s ease;
    animation: pulse 1.5s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.7; }
  }
  .prompts-list {
    max-height: 180px;
    overflow-y: auto;
    background: var(--surface);
    border-radius: 8px;
    border: 1px solid var(--border);
  }
  .prompt-item {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    font-size: 13px;
  }
  .prompt-item:hover { background: #1a1a1a; }
  h3 { margin: 28px 0 12px; font-weight: 500; font-size: 16px; }
  .add-box {
    display: none;
    background: var(--surface);
    padding: 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    margin-bottom: 8px;
  }
  .empty-msg { color: var(--muted); font-size: 13px; padding: 8px 0; }
</style>
</head>
<body>
<div class="container">
  <h1>ARX Image Generator</h1>

  <label>Backend URL</label>
  <input id="backendUrl" placeholder="https://xxxx.trycloudflare.com" onchange="loadUserModels()">

  <div class="row">
    <div>
      <label>Checkpoint</label>
      <select id="checkpoint">
        <option value="">Default (BigLust)</option>
      </select>
    </div>
    <div>
      <label>Sampler</label>
      <select id="sampler">
        <option value="dpmpp_2m">dpmpp_2m</option>
        <option value="euler">euler</option>
        <option value="euler_ancestral">euler_ancestral</option>
      </select>
    </div>
    <div>
      <label>Scheduler</label>
      <select id="scheduler">
        <option value="karras">karras</option>
        <option value="simple">simple</option>
        <option value="normal">normal</option>
      </select>
    </div>
  </div>

  <div class="row">
    <div><label>Steps</label><input id="steps" type="number" value="25"></div>
    <div><label>CFG</label><input id="cfg" type="number" step="0.1" value="4.5"></div>
    <div><label>Width</label><input id="width" type="number" value="832"></div>
    <div><label>Height</label><input id="height" type="number" value="1216"></div>
  </div>

  <label>LoRAs</label>
  <div id="loras"></div>

  <div id="addLoraBox" class="add-box">
    <input id="newLoraUrl" placeholder="Paste LoRA URL" style="margin-bottom:8px">
    <div class="row">
      <button class="secondary" onclick="confirmAddModel('lora')">Download & Add</button>
      <button class="secondary" onclick="cancelAdd('lora')">Cancel</button>
    </div>
  </div>
  <button type="button" class="secondary" onclick="showAdd('lora')">+ Add LoRA</button>

  <label style="margin-top:20px">Add Checkpoint</label>
  <div id="addCheckpointBox" class="add-box">
    <input id="newCheckpointUrl" placeholder="Paste Checkpoint URL" style="margin-bottom:8px">
    <div class="row">
      <button class="secondary" onclick="confirmAddModel('checkpoint')">Download & Add</button>
      <button class="secondary" onclick="cancelAdd('checkpoint')">Cancel</button>
    </div>
  </div>
  <button type="button" class="secondary" onclick="showAdd('checkpoint')">+ Add Checkpoint</button>

  <label>Positive Prompt</label>
  <textarea id="positive"></textarea>

  <label>Negative Prompt</label>
  <textarea id="negative"></textarea>

  <div class="row" style="margin-top: 12px;">
    <button onclick="generate()">Generate</button>
    <button class="secondary" onclick="savePrompt()">Save Prompt</button>
  </div>

  <div class="progress" id="progress"><div class="progress-bar" id="progressBar"></div></div>
  <div id="status" class="status"></div>

  <h3>Saved Prompts</h3>
  <div id="savedPrompts" class="prompts-list"></div>

  <h3>Gallery</h3>
  <div id="gallery" class="gallery"></div>
</div>

<div id="lightbox" onclick="closeLightbox(event)">
  <div class="lb-image-wrap">
    <button class="lb-btn left" onclick="event.stopPropagation(); deleteCurrent()">🗑</button>
    <img id="lbImage" onclick="event.stopPropagation(); toggleZoom()">
    <button class="lb-btn right" onclick="event.stopPropagation(); closeLightbox()">✕</button>
  </div>
</div>

<script>
const CIVITAI_TOKEN = "777a5632707c15ecf54e13eb3b1b862b";

let currentLoras = [];
let currentImageIndex = -1;
let galleryItems = [];
let savedPrompts = JSON.parse(localStorage.getItem("prompts") || "[]");
let isZoomed = false;

let db;
const DB_NAME = "ImageGallery";
const STORE_NAME = "images";

function openDB() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(DB_NAME, 1);
    request.onerror = () => reject(request.error);
    request.onsuccess = () => { db = request.result; resolve(db); };
    request.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(STORE_NAME)) {
        db.createObjectStore(STORE_NAME, { keyPath: "id", autoIncrement: true });
      }
    };
  });
}

async function saveImage(blob) {
  const tx = db.transaction(STORE_NAME, "readwrite");
  const store = tx.objectStore(STORE_NAME);
  return new Promise((resolve, reject) => {
    const req = store.add({ blob, created: Date.now() });
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function loadGallery() {
  const tx = db.transaction(STORE_NAME, "readonly");
  const store = tx.objectStore(STORE_NAME);
  return new Promise((resolve) => {
    const req = store.getAll();
    req.onsuccess = () => {
      const items = req.result.sort((a, b) => b.created - a.created);
      galleryItems = items.map(item => ({
        id: item.id,
        blobUrl: URL.createObjectURL(item.blob)
      }));
      resolve();
    };
  });
}

async function deleteImage(id) {
  const tx = db.transaction(STORE_NAME, "readwrite");
  const store = tx.objectStore(STORE_NAME);
  return new Promise((resolve) => {
    store.delete(id).onsuccess = resolve;
  });
}

function setStatus(msg, type = "") {
  const el = document.getElementById("status");
  el.textContent = msg;
  el.className = "status " + type;
}

function showProgress(show) {
  document.getElementById("progress").style.display = show ? "block" : "none";
  if (!show) document.getElementById("progressBar").style.width = "0%";
}

function getBackend() {
  return document.getElementById("backendUrl").value.trim().replace(/\/$/, "");
}

async function loadUserModels() {
  const backend = getBackend();
  if (!backend) return;

  try {
    const res = await fetch(backend + "/user_models");
    const data = await res.json();

    // Populate checkpoints
    const select = document.getElementById("checkpoint");
    select.innerHTML = '<option value="">Default (BigLust)</option>';
    (data.checkpoints || []).forEach(name => {
      select.innerHTML += `<option value="${name}">${name}</option>`;
    });

    // Populate LoRAs
    currentLoras = data.loras || [];
    renderLoras();
  } catch (e) {
    console.log("Could not load user models");
  }
}

function renderLoras() {
  const container = document.getElementById("loras");
  if (currentLoras.length === 0) {
    container.innerHTML = `<div class="empty-msg">No LoRAs added yet.</div>`;
    return;
  }
  container.innerHTML = "";
  currentLoras.forEach((l, i) => {
    container.innerHTML += `
      <div class="lora-item">
        <input value="${l.name}" onchange="currentLoras[${i}].name=this.value">
        <input type="number" step="0.1" value="${l.strength}" style="width:80px" onchange="currentLoras[${i}].strength=parseFloat(this.value)">
        <button class="danger" onclick="currentLoras.splice(${i},1); renderLoras()">Remove</button>
      </div>`;
  });
}

function showAdd(type) {
  const box = type === "lora" ? "addLoraBox" : "addCheckpointBox";
  document.getElementById(box).style.display = "block";
  document.getElementById(type === "lora" ? "newLoraUrl" : "newCheckpointUrl").focus();
}

function cancelAdd(type) {
  const box = type === "lora" ? "addLoraBox" : "addCheckpointBox";
  document.getElementById(box).style.display = "none";
  document.getElementById(type === "lora" ? "newLoraUrl" : "newCheckpointUrl").value = "";
}

async function confirmAddModel(type) {
  const inputId = type === "lora" ? "newLoraUrl" : "newCheckpointUrl";
  let url = document.getElementById(inputId).value.trim();
  if (!url) return setStatus("Paste a URL", "error");

  if (url.includes("civitai.com") && !url.includes("token=")) {
    url += (url.includes("?") ? "&" : "?") + "token=" + CIVITAI_TOKEN;
  }

  const backend = getBackend();
  if (!backend) return setStatus("Set Backend URL first", "error");

  setStatus("Downloading...");
  showProgress(true);
  document.getElementById("progressBar").style.width = "30%";

  try {
    const res = await fetch(backend + "/download_model", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url, type })
    });
    const data = await res.json();
    document.getElementById("progressBar").style.width = "100%";

    if (data.filename) {
      setStatus("Added: " + data.filename, "ok");
      cancelAdd(type);
      await loadUserModels();
    } else {
      setStatus(data.error || "Download failed", "error");
    }
  } catch (e) {
    setStatus("Error: " + e.message, "error");
  }
  setTimeout(() => showProgress(false), 800);
}

function renderGallery() {
  document.getElementById("gallery").innerHTML = galleryItems.map((item, i) => 
    `<img src="${item.blobUrl}" onclick="openLightbox(${i})">`
  ).join("");
}

function renderSavedPrompts() {
  document.getElementById("savedPrompts").innerHTML = savedPrompts.map((p, i) => 
    `<div class="prompt-item" onclick="loadPrompt(${i})">${p.positive.slice(0,90)}...</div>`
  ).join("");
}

function savePrompt() {
  savedPrompts.unshift({
    positive: document.getElementById("positive").value,
    negative: document.getElementById("negative").value
  });
  localStorage.setItem("prompts", JSON.stringify(savedPrompts));
  renderSavedPrompts();
  setStatus("Prompt saved", "ok");
}

function loadPrompt(i) {
  document.getElementById("positive").value = savedPrompts[i].positive;
  document.getElementById("negative").value = savedPrompts[i].negative;
}

function openLightbox(i) {
  currentImageIndex = i;
  isZoomed = false;
  const img = document.getElementById("lbImage");
  img.src = galleryItems[i].blobUrl;
  img.classList.remove("zoomed");
  document.getElementById("lightbox").style.display = "flex";
}

function closeLightbox(e) {
  if (e && e.target !== document.getElementById("lightbox") && !e.target.classList.contains("lb-btn")) return;
  document.getElementById("lightbox").style.display = "none";
  document.getElementById("lbImage").classList.remove("zoomed");
  isZoomed = false;
}

function toggleZoom() {
  const img = document.getElementById("lbImage");
  isZoomed = !isZoomed;
  img.classList.toggle("zoomed", isZoomed);
}

async function deleteCurrent() {
  if (currentImageIndex >= 0) {
    const id = galleryItems[currentImageIndex].id;
    await deleteImage(id);
    URL.revokeObjectURL(galleryItems[currentImageIndex].blobUrl);
    galleryItems.splice(currentImageIndex, 1);
    renderGallery();
    document.getElementById("lightbox").style.display = "none";
  }
}

async function generate() {
  const backend = getBackend();
  if (!backend) return setStatus("Set Backend URL first", "error");

  setStatus("Generating...");
  showProgress(true);
  let progress = 5;
  const timer = setInterval(() => {
    progress = Math.min(progress + Math.random() * 6, 92);
    document.getElementById("progressBar").style.width = progress + "%";
  }, 600);

  const checkpoint = document.getElementById("checkpoint").value;

  const payload = {
    checkpoint: checkpoint || null,
    sampler: document.getElementById("sampler").value,
    scheduler: document.getElementById("scheduler").value,
    steps: +document.getElementById("steps").value,
    cfg: +document.getElementById("cfg").value,
    width: +document.getElementById("width").value,
    height: +document.getElementById("height").value,
    loras: currentLoras,
    positive: document.getElementById("positive").value,
    negative: document.getElementById("negative").value
  };

  try {
    const res = await fetch(backend + "/generate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    clearInterval(timer);
    document.getElementById("progressBar").style.width = "100%";

    if (data.image) {
      const base64 = data.image.split(",")[1];
      const binary = atob(base64);
      const array = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) array[i] = binary.charCodeAt(i);
      const blob = new Blob([array], { type: "image/png" });

      await saveImage(blob);
      await loadGallery();
      renderGallery();
      setStatus("Done", "ok");
    } else {
      setStatus(data.error || "No image returned", "error");
    }
  } catch (e) {
    clearInterval(timer);
    setStatus("Error: " + e.message, "error");
  }
  setTimeout(() => showProgress(false), 700);
}

async function init() {
  await openDB();
  await loadGallery();
  renderLoras();
  renderGallery();
  renderSavedPrompts();
}
init();
</script>
</body>
</html>
