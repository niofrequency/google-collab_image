<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Colab Image Generator</title>
<style>
  :root {
    --bg: #0a0a0a;
    --surface: #141414;
    --border: #2a2a2a;
    --text: #e8e8e8;
    --muted: #888;
    --accent: #8b2e2e;
    --accent-hover: #a33a3a;
  }
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }
  .container { max-width: 1000px; margin: 0 auto; padding: 32px 20px; }
  h1 { margin: 0 0 24px; font-weight: 500; letter-spacing: -0.5px; }
  label { display: block; margin: 16px 0 6px; font-size: 13px; color: var(--muted); font-weight: 500; }
  input, select, textarea, button {
    width: 100%;
    padding: 10px 12px;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
  }
  textarea { min-height: 90px; resize: vertical; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
  .row { display: flex; gap: 16px; }
  .row > div { flex: 1; }
  .lora-item {
    background: var(--surface);
    padding: 12px;
    margin-bottom: 8px;
    border-radius: 8px;
    border: 1px solid var(--border);
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .lora-item input { margin: 0; }
  .lora-item button { width: auto; padding: 6px 12px; }
  button {
    cursor: pointer;
    background: var(--accent);
    border: none;
    font-weight: 500;
    transition: background 0.15s;
  }
  button:hover { background: var(--accent-hover); }
  button.secondary { background: #222; }
  button.secondary:hover { background: #2a2a2a; }
  button.danger { background: #5a1f1f; }
  button.danger:hover { background: #7a2a2a; }
  .gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 12px;
    margin-top: 16px;
  }
  .gallery img {
    width: 100%;
    height: 200px;
    object-fit: cover;
    border-radius: 8px;
    cursor: pointer;
    border: 1px solid var(--border);
  }
  #lightbox {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.92);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
  }
  #lightbox img { max-width: 90%; max-height: 85vh; border-radius: 8px; }
  .lb-controls { position: absolute; top: 20px; right: 20px; display: flex; gap: 8px; }
  .lb-controls button { width: auto; padding: 8px 16px; }
  .status { margin: 12px 0; min-height: 20px; font-size: 14px; }
  .status.error { color: #c0392b; }
  .status.ok { color: #2ecc71; }
  .progress {
    height: 6px;
    background: #222;
    border-radius: 3px;
    overflow: hidden;
    margin: 8px 0;
    display: none;
  }
  .progress-bar {
    height: 100%;
    width: 0%;
    background: var(--accent);
    transition: width 0.3s;
  }
  .prompts-list {
    max-height: 180px;
    overflow-y: auto;
    background: var(--surface);
    border-radius: 8px;
    border: 1px solid var(--border);
  }
  .prompt-item {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    font-size: 13px;
  }
  .prompt-item:hover { background: #1a1a1a; }
  h3 { margin: 28px 0 12px; font-weight: 500; font-size: 16px; }
</style>
</head>
<body>
<div class="container">
  <h1>Image Generator</h1>

  <label>Backend URL</label>
  <input id="backendUrl" placeholder="https://xxxx.trycloudflare.com">

  <div class="row">
    <div>
      <label>Model</label>
      <select id="checkpoint" onchange="updateLorasForModel()">
        <option value="biglust">BigLust (SDXL)</option>
        <option value="wan">Wan 2.1</option>
      </select>
    </div>
    <div>
      <label>Sampler</label>
      <select id="sampler">
        <option value="dpmpp_2m">dpmpp_2m</option>
        <option value="euler">euler</option>
        <option value="euler_ancestral">euler_ancestral</option>
      </select>
    </div>
    <div>
      <label>Scheduler</label>
      <select id="scheduler">
        <option value="karras">karras</option>
        <option value="simple">simple</option>
        <option value="normal">normal</option>
      </select>
    </div>
  </div>

  <div class="row">
    <div><label>Steps</label><input id="steps" type="number" value="25"></div>
    <div><label>CFG</label><input id="cfg" type="number" step="0.1" value="4.5"></div>
    <div><label>Width</label><input id="width" type="number" value="832"></div>
    <div><label>Height</label><input id="height" type="number" value="1216"></div>
  </div>

  <label>LoRAs</label>
  <div id="loras"></div>
  <button type="button" class="secondary" onclick="addLora()">+ Add LoRA</button>

  <label>Add LoRA from URL</label>
  <div class="row">
    <div style="flex:3"><input id="loraUrl" placeholder="https://civitai.com/api/download/models/..."></div>
    <div style="flex:1"><button class="secondary" onclick="downloadLora()">Download</button></div>
  </div>

  <label>Positive Prompt</label>
  <textarea id="positive"></textarea>

  <label>Negative Prompt</label>
  <textarea id="negative"></textarea>

  <div class="row" style="margin-top: 12px;">
    <button onclick="generate()">Generate</button>
    <button class="secondary" onclick="savePrompt()">Save Prompt</button>
  </div>

  <div class="progress" id="progress"><div class="progress-bar" id="progressBar"></div></div>
  <div id="status" class="status"></div>

  <h3>Saved Prompts</h3>
  <div id="savedPrompts" class="prompts-list"></div>

  <h3>Gallery</h3>
  <div id="gallery" class="gallery"></div>
</div>

<div id="lightbox">
  <div class="lb-controls">
    <button class="danger" onclick="deleteCurrent()">Delete</button>
    <button onclick="closeLightbox()">Close</button>
  </div>
  <img id="lbImage">
</div>

<script>
const modelLoras = {
  biglust: [
    { name: "pussy.safetensors", strength: 1.0 },
    { name: "skin.safetensors", strength: 0.8 }
  ],
  wan: [
    { name: "FusionX/Wan2.1_T2V_14B_FusionX_LoRA.safetensors", strength: 1.0 },
    { name: "pussy.safetensors", strength: 1.0 },
    { name: "skin.safetensors", strength: 0.8 }
  ]
};

let currentLoras = [...modelLoras.biglust];
let currentImageIndex = -1;
let gallery = JSON.parse(localStorage.getItem("gallery") || "[]");
let savedPrompts = JSON.parse(localStorage.getItem("prompts") || "[]");

function setStatus(msg, type = "") {
  const el = document.getElementById("status");
  el.textContent = msg;
  el.className = "status " + type;
}

function showProgress(show) {
  document.getElementById("progress").style.display = show ? "block" : "none";
  if (!show) document.getElementById("progressBar").style.width = "0%";
}

function updateLorasForModel() {
  const model = document.getElementById("checkpoint").value;
  currentLoras = modelLoras[model] ? [...modelLoras[model]] : [];
  renderLoras();
}

function renderLoras() {
  const container = document.getElementById("loras");
  container.innerHTML = "";
  currentLoras.forEach((l, i) => {
    container.innerHTML += `
      <div class="lora-item">
        <input placeholder="LoRA filename" value="${l.name}" onchange="currentLoras[${i}].name=this.value">
        <input type="number" step="0.1" value="${l.strength}" style="width:80px" onchange="currentLoras[${i}].strength=parseFloat(this.value)">
        <button class="danger" onclick="currentLoras.splice(${i},1);renderLoras()">Remove</button>
      </div>`;
  });
}

function addLora() {
  currentLoras.push({ name: "new_lora.safetensors", strength: 0.8 });
  renderLoras();
}

async function downloadLora() {
  const url = document.getElementById("loraUrl").value.trim();
  if (!url) return setStatus("Paste a LoRA URL first", "error");

  const backend = document.getElementById("backendUrl").value.trim().replace(/\/$/, "");
  if (!backend) return setStatus("Set Backend URL first", "error");

  setStatus("Downloading LoRA...");
  showProgress(true);
  document.getElementById("progressBar").style.width = "30%";

  try {
    const res = await fetch(backend + "/download_lora", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url })
    });
    const data = await res.json();
    document.getElementById("progressBar").style.width = "100%";

    if (data.filename) {
      currentLoras.push({ name: data.filename, strength: 0.8 });
      renderLoras();
      setStatus("LoRA added: " + data.filename, "ok");
      document.getElementById("loraUrl").value = "";
    } else {
      setStatus(data.error || "Download failed", "error");
    }
  } catch (e) {
    setStatus("Error: " + e.message, "error");
  }
  setTimeout(() => showProgress(false), 800);
}

function renderGallery() {
  document.getElementById("gallery").innerHTML = gallery.map((img, i) => 
    `<img src="${img}" onclick="openLightbox(${i})">`
  ).join("");
}

function renderSavedPrompts() {
  document.getElementById("savedPrompts").innerHTML = savedPrompts.map((p, i) => 
    `<div class="prompt-item" onclick="loadPrompt(${i})">${p.positive.slice(0,90)}...</div>`
  ).join("");
}

function savePrompt() {
  savedPrompts.unshift({
    positive: document.getElementById("positive").value,
    negative: document.getElementById("negative").value
  });
  localStorage.setItem("prompts", JSON.stringify(savedPrompts));
  renderSavedPrompts();
  setStatus("Prompt saved", "ok");
}

function loadPrompt(i) {
  document.getElementById("positive").value = savedPrompts[i].positive;
  document.getElementById("negative").value = savedPrompts[i].negative;
}

function openLightbox(i) {
  currentImageIndex = i;
  document.getElementById("lbImage").src = gallery[i];
  document.getElementById("lightbox").style.display = "flex";
}
function closeLightbox() { document.getElementById("lightbox").style.display = "none"; }
function deleteCurrent() {
  if (currentImageIndex >= 0) {
    gallery.splice(currentImageIndex, 1);
    localStorage.setItem("gallery", JSON.stringify(gallery));
    renderGallery();
    closeLightbox();
  }
}

async function generate() {
  const backend = document.getElementById("backendUrl").value.trim().replace(/\/$/, "");
  if (!backend) return setStatus("Set Backend URL first", "error");

  setStatus("Generating...");
  showProgress(true);
  let progress = 10;
  const timer = setInterval(() => {
    progress = Math.min(progress + Math.random() * 8, 90);
    document.getElementById("progressBar").style.width = progress + "%";
  }, 800);

  const payload = {
    sampler: document.getElementById("sampler").value,
    scheduler: document.getElementById("scheduler").value,
    steps: +document.getElementById("steps").value,
    cfg: +document.getElementById("cfg").value,
    width: +document.getElementById("width").value,
    height: +document.getElementById("height").value,
    loras: currentLoras,
    positive: document.getElementById("positive").value,
    negative: document.getElementById("negative").value
  };

  try {
    const res = await fetch(backend + "/generate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    clearInterval(timer);
    document.getElementById("progressBar").style.width = "100%";

    if (data.image) {
      gallery.unshift(data.image);
      localStorage.setItem("gallery", JSON.stringify(gallery));
      renderGallery();
      setStatus("Done", "ok");
    } else {
      setStatus(data.error || "No image returned", "error");
    }
  } catch (e) {
    clearInterval(timer);
    setStatus("Error: " + e.message, "error");
  }
  setTimeout(() => showProgress(false), 600);
}

// Init
updateLorasForModel();
renderGallery();
renderSavedPrompts();
</script>
</body>
</html>
